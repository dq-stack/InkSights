name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  test-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Go 1.23 on purpose: 1.24+ needs Linux kernel 3.2+; keep the binary
      # runnable on every Kindle kernel.
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache-dependency-path: app/go.sum

      - name: Vet and test
        working-directory: app
        run: |
          test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
          go vet ./...
          GOOS=linux GOARCH=arm GOARM=7 CGO_ENABLED=0 go vet ./...
          go test ./...

      - name: Shell syntax
        run: |
          for f in packaging/extension/activity.sh packaging/documents/InkSights.sh tools/*.sh; do
            sh -n "$f"
          done

      - name: Build downloads
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then V="${GITHUB_REF_NAME#v}"; else V="0.0.0-${GITHUB_SHA::7}"; fi
          sh tools/package.sh "$V"

      - uses: actions/upload-artifact@v4
        with:
          name: inksights
          path: release/*.zip

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release/*.zip \
            --title "InkSights $GITHUB_REF_NAME" \
            --notes-file ".github/release-notes/$GITHUB_REF_NAME.md"
